name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Third-party actions are pinned to full commit SHAs (the tag is in the comment); Dependabot keeps them current.
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LocalAssistant.slnx

      - name: Check formatting
        run: dotnet format LocalAssistant.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build LocalAssistant.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution LocalAssistant.slnx --configuration Release --no-build

      - name: Publish (as the scheduled-task scripts do)
        if: runner.os == 'Windows'
        run: dotnet publish src/LocalAssistant/LocalAssistant.csproj --configuration Release --output publish --no-restore

      - name: Check the executable exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path publish/LocalAssistant.exe)) { throw "LocalAssistant.exe was not published" }
